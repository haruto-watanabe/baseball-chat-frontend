<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>野球談義 - ライブチャット</title>
    <style>
        /* スマホ・PC両対応の最新スタイル */
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { font-family: "Roboto", sans-serif; background-color: #0f0f0f; color: #ffffff; display: flex; flex-direction: column; height: 100dvh; }
        .header { flex-shrink: 0; padding: 10px 15px; background: #0f0f0f; border-bottom: 1px solid #2f2f2f; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { color: #aaa; text-decoration: none; font-size: 1.2rem; }
        h2 { font-size: 1rem; margin: 0; flex-grow: 1; text-align: center; }
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 10px 5px; display: flex; flex-direction: column; gap: 4px; }
        .message-container { display: flex; align-items: flex-start; padding: 4px 10px; }
        .avatar { width: 24px; height: 24px; border-radius: 50%; margin-right: 12px; flex-shrink: 0; }
        .user-name { font-weight: bold; color: #aaa; font-size: 0.85rem; margin-right: 8px; }
        .text { color: #efefef; font-size: 0.85rem; word-break: break-word; }
        .input-area { flex-shrink: 0; background: #0f0f0f; padding: 10px 15px; border-top: 1px solid #2f2f2f; display: flex; align-items: center; gap: 8px; }
        .input-wrapper { flex-grow: 1; background: #272727; border-radius: 20px; padding: 2px 15px; display: flex; }
        input { background: transparent; border: none; color: white; padding: 10px 0; outline: none; font-size: 16px; }
        .send-btn { background: transparent; border: none; color: #3ea6ff; font-weight: bold; cursor: pointer; }

        @media (min-width: 769px) {
            body { background-color: #ffffff; color: #333; }
            .header { background: #ffffff; border-bottom: 1px solid #ddd; }
            h2, .back-btn, .user-name, .text, input { color: #333; }
            .input-area { background: #ffffff; border-top: 1px solid #ddd; }
            .input-wrapper { background: #f1f1f1; border: 1px solid #ccc; border-radius: 10px; }
            #name { flex: 2 !important; border-right: 1px solid #ccc !important; margin-right: 10px; }
            #message { flex: 7 !important; }
        }
    </style>
</head>
<body>

<div class="header">
    <a href="index.html" class="back-btn">✕</a>
    <h2 id="room-title">チャット</h2>
    <div style="width: 30px;"></div>
</div>

<div id="chat-box"></div>

<div class="input-area">
    <div class="input-wrapper">
        <input type="text" id="name" placeholder="名前" style="width: 60px;">
        <input type="text" id="message" placeholder="チャットを入力..." onkeydown="handleKeyPress(event)">
    </div>
    <button class="send-btn" onclick="send()">送信</button>
</div>

<!-- ライブラリの読み込み -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script>
    var stompClient = null;
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('gameId');
    const gameDateStr = urlParams.get('date');
    const BASE_URL = "https://open-baseball-chat.onrender.com";

    document.getElementById('room-title').innerText = gameId ? gameId.split('-').slice(0, 2).join(' vs ') : "ライブチャット";

    function connect() {
        var socket = new SockJS(BASE_URL + '/chat-websocket');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;
        stompClient.connect({}, function (frame) {
            stompClient.subscribe('/topic/messages/' + gameId, function (response) {
                showChat(response.body);
            });
        });
    }

    function checkAccess() {
        if (!gameDateStr) return true;
        const now = new Date();
        const [year, month, day] = gameDateStr.split('-').map(Number);
        const openTime = new Date(year, month - 1, day, 10, 0, 0);
        const closeTime = new Date(year, month - 1, day + 1, 4, 0, 0);
        if (now < openTime || now > closeTime) {
            alert("この試合のチャットは、試合当日10:00から翌日4:00まで利用可能です。");
            location.href = 'index.html';
            return false;
        }
        return true;
    }

    function handleKeyPress(event) { if (event.key === 'Enter') send(); }

    function send() {
        var name = document.getElementById('name').value || "匿名";
        var msg = document.getElementById('message').value;
        if (!msg) return;
        stompClient.send("/app/send/" + gameId, {}, name + ": " + msg);
        document.getElementById('message').value = '';
    }

    function showChat(message) {
        var chatBox = document.getElementById('chat-box');
        var parts = message.split(': ');
        var container = document.createElement('div');
        container.className = 'message-container';
        var iconUrl = "https://ui-avatars.com/api/?name=" + encodeURIComponent(parts[0]) + "&background=random&color=fff";
        container.innerHTML = `<img src="${iconUrl}" class="avatar"><div class="content"><span class="user-name">${parts[0]}</span><span class="text">${parts[1]}</span></div>`;
        chatBox.appendChild(container);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    window.onload = () => { if (checkAccess()) connect(); };
</script>
</body>
</html>
